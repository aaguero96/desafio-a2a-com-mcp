[project]
name = "desafio-a2a-com-mcp"
version = "1.0.0"
description = "A Ponte: um servidor MCP e um agente A2A que o consome por dentro"
requires-python = ">=3.10"

# Versoes travadas. Nenhuma dependencia de provedor de LLM: o agente decide por regra.
dependencies = [
    "mcp==2.2.0",
    "starlette==1.6.0",
    "uvicorn==0.53.0",
    "pydantic==2.13.5",
]

[tool.uv]
package = false
